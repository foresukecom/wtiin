<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>現在時刻</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>現在時刻</h2>
  <table>
    <tr>
      <th>フォーマット</th>
      <th>時刻</th>
    </tr>
    <tr data-label="JST" tabindex="0">
      <td>JST</td>
      <td id="timeJST">--:--:--</td>
    </tr>
    <tr data-label="UTC" tabindex="0">
      <td>UTC</td>
      <td id="timeUTC">--:--:--</td>
    </tr>
    <tr data-label="UnixTime" tabindex="0">
      <td>UnixTime</td>
      <td id="timeUnix">-----</td>
    </tr>
    <tr data-label="和暦" tabindex="0">
      <td>和暦</td>
      <td id="timeWareki">--</td>
    </tr>
  </table>
  <p id="copyStatus" class="status" aria-live="polite">行をクリックすると、時刻をコピーできます</p>
  <h3>変換</h3>
  <input id="convertInput" type="text" placeholder="1795741800 / 2026-11-27 10:10" aria-label="変換する UnixTime または日時" autocomplete="off" spellcheck="false">
  <p id="convertNote" class="note">UnixTime（秒・ミリ秒）か日時を入力すると、4つの形式に変換します</p>
  <table id="convertResult" hidden>
    <tr data-label="JST" tabindex="0">
      <td>JST</td>
      <td id="convJST"></td>
    </tr>
    <tr data-label="UTC" tabindex="0">
      <td>UTC</td>
      <td id="convUTC"></td>
    </tr>
    <tr data-label="UnixTime" tabindex="0">
      <td>UnixTime</td>
      <td id="convUnix"></td>
    </tr>
    <tr data-label="和暦" tabindex="0">
      <td>和暦</td>
      <td id="convWareki"></td>
    </tr>
  </table>
  <script src="popup.js"></script>
</body>
</html>
