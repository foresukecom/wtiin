<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  /* ストア用スクリーンショットの「スライド」。左に説明、右に拡大したポップアップ */
  :root {
    --paper: #f3f6fa;
    --ink: #1b2330;
    --muted: #5a6575;
    --accent: #1f5fd1;
    --red: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
    padding: 84px 96px;
    display: flex;
    gap: 64px;
    align-items: center;
  }
  .text { flex: 1; min-width: 0; }
  .eyebrow {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
  }
  h1 {
    margin-top: 18px;
    font-size: 48px;
    line-height: 1.3;
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  p {
    margin-top: 28px;
    font-size: 24px;
    line-height: 1.8;
    color: var(--muted);
  }
  .rule {
    margin-top: 40px;
    width: 120px;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--red) 30%, var(--accent) 30%);
  }
  .aside { flex: none; }
  .aside img {
    display: block;
    border-radius: 14px;
    box-shadow: 0 18px 48px rgba(27, 35, 48, 0.2);
  }
  .page {
    position: fixed;
    right: 40px;
    top: 32px;
    font-size: 16px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="page">{{page}}</div>
  <div class="text">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{title}}</h1>
    <p>{{body}}</p>
    <div class="rule"></div>
  </div>
  <div class="aside"><img src="data:image/png;base64,{{popup}}" width="{{popupWidth}}" alt=""></div>
</body>
</html>
